# Netlify build + the one serverless function this site has.
#
# The site is otherwise a static SPA; netlify/functions/contact.mts exists
# purely so the contact form can reach a mail server without the SMTP password
# being shipped to the browser.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# nodemailer resolves some transports lazily; esbuild cannot follow that, so it
# is bundled as-is from node_modules rather than statically analysed.
[functions."contact"]
  external_node_modules = ["nodemailer"]
